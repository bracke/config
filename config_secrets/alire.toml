name = "config_secrets"
description = "Bridge: read secret config values as protected Secrets"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/bracke/config"

tags = ["config", "secrets", "bridge"]

[[depends-on]]
gnat_native = "=15.2.1"
[[depends-on]]
config = "*"
[[depends-on]]
secrets = "*"
[[depends-on]]
secrets_file = "*"
[[depends-on]]
representation = "*"
[[depends-on]]
cryptolib = "*"

[[pins]]
config = { path = ".." }
[[pins]]
secrets = { path = "../../secrets" }
[[pins]]
secrets_file = { path = "../../secrets/secrets_file" }
[[pins]]
representation = { path = "../../representation" }
[[pins]]
cryptolib = { path = "../../cryptolib" }

[build-profiles]
"*" = "development"
