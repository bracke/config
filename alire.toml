name = "config"
description = "Headless layered configuration: env, dotenv, INI, JSON, TOML"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/bracke/config"
long-description = "Headless configuration for Ada 2022 - a general settings loader for the whole stack, not tied to any one application."

tags = ["config", "settings", "env", "headless"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
representation = "*"

[[depends-on]]
cryptolib = "*"

[[pins]]
representation = { url = "https://github.com/bracke/representation.git", commit = "23a5655b43679f4919d215b488c73a00eb79f8e3" }
[[pins]]
cryptolib = { url = "https://github.com/bracke/cryptolib.git", commit = "2e5c415f65fd49c2a496c97813740fa9b83e02fa" }

[[actions]]
type = "test"
command = ["sh", "-c", "cd tests/config_tests && alr build && ./bin/tests"]

[build-profiles]
"*" = "development"
