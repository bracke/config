name = "config"
description = "Headless layered configuration: env, dotenv, INI, JSON, TOML"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/bracke/config"

tags = ["config", "settings", "env", "headless"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
representation = "*"

[[pins]]
representation = { path = "../representation" }

[[actions]]
type = "test"
command = ["sh", "-c", "cd tests/config_tests && alr build && ./bin/tests"]

[build-profiles]
"*" = "development"
